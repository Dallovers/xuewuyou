<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学无忧 · 课程学院</title><link rel="stylesheet" href="style.css"></head><body>
<a class="skip" href="#world">进入三维场景</a><canvas id="world" tabindex="0" aria-label="课程学院三维场景，漫游模式使用 WASD 移动，E 互动"></canvas>
<header><div class="identity"><strong>学无忧</strong><span>课程学院</span></div><nav aria-label="观察位置"><button data-view="exterior" class="active" aria-pressed="true">外观</button><button data-view="entry" aria-pressed="false">入口</button><button data-view="lobby" aria-pressed="false">门厅</button><button data-view="classroom" aria-pressed="false">教室</button><button id="walk" class="primary">开始漫游</button></nav></header>
<div id="crosshair" hidden aria-hidden="true"></div><div id="loading" role="status"><span class="spinner"></span><p>正在加载建筑与材质</p><small>窗洞、屋顶与室内均为三维几何</small></div>
<footer><div class="where"><strong id="location">学院前庭</strong><span id="controls">拖动旋转 · 滚轮缩放</span></div><div class="tools"><select id="quality" aria-label="画面质量"><option value="auto">自适应画质</option><option value="fluid">流畅优先</option><option value="high">细节优先</option></select><button id="room-controls" hidden>教室设备</button><button id="clay">查看灰模</button><button id="capture">保存画面</button><button id="export">下载模型</button><button id="help">操作说明</button></div></footer>
<button id="interact" hidden><kbd>E</kbd><span><strong id="action"></strong><small id="action-detail"></small></span></button><div id="toast" role="status" aria-live="polite" hidden></div>
<div id="touch" hidden aria-label="漫游方向"><button data-key="KeyW" aria-label="前进">↑</button><div><button data-key="KeyA" aria-label="向左">←</button><button data-key="KeyS" aria-label="后退">↓</button><button data-key="KeyD" aria-label="向右">→</button></div></div>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><div><small id="panel-context">课程学院</small><h1 id="panel-title"></h1></div><button id="close-panel" aria-label="关闭">×</button></div><div id="panel-body"></div></dialog>
<script type="module" src="app.bundle.js"></script><script src="../../js/features/campus-hub/return-bridge.js"></script></body></html>
