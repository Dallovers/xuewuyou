<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>学无忧 · 管理后台</title>
<style>
  :root { --ink:#1a1a1a; --sub:#6b6b6b; --line:#e3e3e3; --bg:#fafafa; --card:#fff;
          --accent:#2f6fed; --danger:#d64545; --warn:#b8860b; --ok:#2f8a4d; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--ink); background:var(--bg); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px;
           display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .who { color:var(--sub); font-size:13px; }
  header .spacer { flex:1; }
  main { padding:20px; max-width:1180px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card .n { font-size:24px; font-weight:600; line-height:1.2; }
  .card .l { color:var(--sub); font-size:12px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:20px; overflow:hidden; }
  section > h2 { font-size:14px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  .toolbar { display:flex; gap:8px; padding:12px 16px; flex-wrap:wrap; align-items:center; }
  input[type=text], select { font:inherit; padding:6px 10px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); }
  input[type=text] { min-width:180px; }
  button { font:inherit; padding:5px 10px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--ink); cursor:pointer; }
  button:hover { border-color:#c9c9c9; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); border-color:#f0cfcf; }
  button.small { padding:3px 8px; font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 12px; border-top:1px solid var(--line); vertical-align:top; font-size:13px; }
  th { background:#f6f6f6; font-weight:600; color:var(--sub); font-size:12px; white-space:nowrap; }
  td.actions { white-space:nowrap; }
  td.actions button { margin-right:4px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; border:1px solid var(--line); color:var(--sub); }
  .tag.ok { color:var(--ok); border-color:#c9e3d3; background:#f2faf5; }
  .tag.bad { color:var(--danger); border-color:#f0cfcf; background:#fdf3f3; }
  .tag.warn { color:var(--warn); border-color:#ecdcb8; background:#fdf9ee; }
  .tag.admin { color:var(--accent); border-color:#cddcfb; background:#f2f6ff; }
  .muted { color:var(--sub); }
  .empty { padding:24px 16px; color:var(--sub); text-align:center; }
  .msg { padding:8px 16px; font-size:13px; display:none; }
  .msg.show { display:block; }
  .msg.err { background:#fdf3f3; color:var(--danger); }
  .msg.ok { background:#f2faf5; color:var(--ok); }
  pre { margin:0; font:12px/1.5 ui-monospace,Consolas,monospace; white-space:pre-wrap; word-break:break-all; }
  #gate { max-width:420px; margin:80px auto; background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:28px; }
  #gate h1 { font-size:17px; margin:0 0 6px; text-align:center; }
  #gate p { color:var(--sub); font-size:13px; margin:0 0 18px; text-align:center; }
  #gate label { display:block; font-size:12px; color:var(--sub); margin:0 0 4px; }
  #gate input { width:100%; margin-bottom:12px; }
  #gate button { width:100%; padding:9px; font-size:14px; }
  #gate code { background:#f3f3f3; padding:1px 4px; border-radius:4px; font-size:12px; }
  .pager { display:flex; gap:8px; align-items:center; padding:10px 16px; border-top:1px solid var(--line); }
  details summary { cursor:pointer; color:var(--accent); font-size:12px; margin-top:2px; }
  details[open] summary { margin-bottom:4px; }
  .answer { color:var(--sub); white-space:pre-wrap; }
</style>
</head>
<body>

<div id="gate">
  <h1>管理员登录</h1>
  <p>用管理员账号登录。账号需先由维护者用<br><code>node scripts/grant-admin.js 用户名</code> 授权。</p>
  <form id="loginForm" autocomplete="on">
    <label for="lgUser">管理员用户名</label>
    <input type="text" id="lgUser" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="用户名">
    <label for="lgPass">密码</label>
    <input type="password" id="lgPass" name="password" autocomplete="current-password" placeholder="密码">
    <button class="primary" id="lgSubmit" type="submit">登 录</button>
  </form>
  <div class="msg" id="lgMsg"></div>
</div>

<header id="bar" hidden>
  <h1>学无忧 · 管理后台</h1>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <button id="refresh">刷新</button>
  <button id="logout">退出登录</button>
</header>

<main id="main" hidden>
  <div class="cards" id="cards"></div>

  <section>
    <h2>账号</h2>
    <div class="toolbar">
      <input type="text" id="uQuery" placeholder="按用户名 / 昵称搜">
      <select id="uFilter">
        <option value="all">全部</option>
        <option value="banned">已封禁</option>
        <option value="muted">已禁言</option>
        <option value="admin">管理员</option>
      </select>
      <button class="primary" id="uSearch">查询</button>
      <button id="uUnifyNicks" title="把所有人的显示名改成各自的用户名">统一显示名为用户名</button>
      <span class="muted" id="uCount"></span>
    </div>
    <div class="msg" id="uMsg"></div>
    <table>
      <thead>
        <tr><th>用户名</th><th>昵称</th><th>注册时间</th><th>状态</th><th>留言</th><th>操作</th></tr>
      </thead>
      <tbody id="uBody"></tbody>
    </table>
    <div class="pager"><button class="small" id="uPrev">上一页</button><span class="muted" id="uPage"></span><button class="small" id="uNext">下一页</button></div>
  </section>

  <section>
    <h2>留言</h2>
    <div class="toolbar">
      <input type="text" id="pQuery" placeholder="按内容 / 用户名搜">
      <select id="pFilter">
        <option value="all">全部</option>
        <option value="removed">仅已下架</option>
      </select>
      <button class="primary" id="pSearch">查询</button>
      <span class="muted" id="pCount"></span>
    </div>
    <div class="msg" id="pMsg"></div>
    <table>
      <thead><tr><th style="width:150px">作者</th><th>内容</th><th style="width:150px">时间</th><th style="width:110px">操作</th></tr></thead>
      <tbody id="pBody"></tbody>
    </table>
    <div class="pager"><button class="small" id="pPrev">上一页</button><span class="muted" id="pPage"></span><button class="small" id="pNext">下一页</button></div>
  </section>

  <section>
    <h2>公开 AI 回答</h2>
    <div class="toolbar">
      <input type="text" id="nQuery" placeholder="按问题 / 回答内容搜">
      <button class="primary" id="nSearch">查询</button>
      <span class="muted" id="nCount"></span>
    </div>
    <div class="msg" id="nMsg"></div>
    <table>
      <thead><tr><th style="width:150px">作者</th><th style="width:90px">类型</th><th>问题与回答</th><th style="width:140px">时间</th><th style="width:80px">操作</th></tr></thead>
      <tbody id="nBody"></tbody>
    </table>
    <div class="pager"><button class="small" id="nPrev">上一页</button><span class="muted" id="nPage"></span><button class="small" id="nNext">下一页</button></div>
  </section>

  <section>
    <h2>操作审计（最近 100 条）</h2>
    <table>
      <thead><tr><th style="width:150px">时间</th><th style="width:120px">操作人</th><th style="width:110px">动作</th><th style="width:120px">对象</th><th>说明</th></tr></thead>
      <tbody id="aBody"></tbody>
    </table>
  </section>
</main>

<!-- 与主站共用同一份后端地址配置；缺了它，从 GitHub Pages 打开的后台不知道该请求哪台服务器。
     这行不能加 defer——下面的内联脚本要同步读到 window.WG_DEPLOY。 -->
<script src="js/deploy-config.js?v=2"></script>
<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'xwy_admin_token';
  var H = function () { var t = localStorage.getItem(TOKEN_KEY); return t ? { 'Authorization': 'Bearer ' + t } : {}; };

  /* 接口根地址，按优先级：
   *   1) ?api=https://后端域名       —— 临时指定，优先级最高
   *   2) window.WG_DEPLOY.apiBase    —— js/deploy-config.js（主站也用同一份配置）
   *   3) 同源                        —— 直接用后端域名打开（后端自己伺服这个页面）
   * 只取 origin：路径、查询串一律忽略，避免拼出奇怪的地址。
   *
   * 本机调试时必须跳过第 2 条，否则 localhost 打开的后台会打到线上后端去。 */
  var IS_LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === 'file:';
  var API_BASE = (function () {
    var raw = new URLSearchParams(location.search).get('api')
      || (!IS_LOCAL && window.WG_DEPLOY && window.WG_DEPLOY.apiBase) || '';
    if (!raw) return '';
    try { return new URL(raw).origin; } catch (e) { return ''; }
  })();
  var STATIC_HOST = /\.github\.io$/.test(location.hostname) || /\.gitee\.io$/.test(location.hostname);

  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, text, cls) {
    var n = document.createElement(tag);
    if (text != null) n.textContent = String(text);
    if (cls) n.className = cls;
    return n;
  };
  var when = function (ms) {
    if (!ms) return '—';
    var d = new Date(ms);
    var p = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  };

  function api(method, path, body) {
    return fetch(API_BASE + path, {
      method: method,
      headers: Object.assign({ 'Content-Type': 'application/json' }, H()),
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; })
        .then(function (d) {
          d.__status = r.status;
          /* token 过期或被封号：直接退回登录页，别让人对着空表格点按钮 */
          if (r.status === 401 && path.indexOf('/api/admin/login') !== 0) showLogin('登录已失效，请重新登录。');
          return d;
        });
    });
  }

  function say(node, text, kind) {
    node.textContent = text || '';
    node.className = 'msg' + (text ? ' show ' : ' ') + (kind || '');
    if (text) setTimeout(function () { if (node.textContent === text) { node.textContent = ''; node.className = 'msg'; } }, 4000);
  }

  function showLogin(message) {
    $('gate').hidden = false;
    $('bar').hidden = true;
    $('main').hidden = true;
    if (message) {
      var m = $('lgMsg');
      m.textContent = message;
      m.className = 'msg show err';
    }
    var u = $('lgUser');
    if (u && !u.value) u.focus();
  }

  function showConsole(user) {
    $('gate').hidden = true;
    $('bar').hidden = false;
    $('main').hidden = false;
    $('who').textContent = '当前：' + user.username + (user.nick && user.nick !== user.username ? '（' + user.nick + '）' : '')
      + (API_BASE ? ' · 后端 ' + API_BASE : '');
    refreshAll();
  }

  /* ---------- 总览 ---------- */
  function renderCards(o) {
    var box = $('cards');
    box.replaceChildren();
    var items = [
      [o.users.total, '注册账号'], [o.users.today, '今日新增'], [o.online, '在线（5 分钟）'],
      [o.users.banned, '已封禁'], [o.users.muted, '已禁言'], [o.users.admins, '管理员'],
      [o.posts.total, '留言总数'], [o.posts.removed, '已下架留言']
    ];
    items.forEach(function (it) {
      var c = el('div', null, 'card');
      c.appendChild(el('div', it[0], 'n'));
      c.appendChild(el('div', it[1], 'l'));
      box.appendChild(c);
    });
  }

  function loadOverview() {
    return api('GET', '/api/admin/overview').then(function (d) {
      if (!d.ok) { say($('uMsg'), d.error, 'err'); return; }
      renderCards(d);
    });
  }

  /* ---------- 账号 ---------- */
  var userPage = { offset: 0, limit: 50, total: 0 };

  function userRow(u) {
    var tr = el('tr');
    tr.appendChild(el('td', u.username));
    tr.appendChild(el('td', u.nick));
    tr.appendChild(el('td', when(u.createdAt), 'muted'));

    var st = el('td');
    if (u.role === 'admin') st.appendChild(el('span', '管理员', 'tag admin'));
    if (u.banned) st.appendChild(el('span', '已封禁', 'tag bad'));
    if (u.muted) st.appendChild(el('span', '禁言至 ' + when(u.mutedUntil), 'tag warn'));
    if (!u.role && !u.banned && !u.muted) st.appendChild(el('span', u.online ? '在线' : '正常', 'tag ' + (u.online ? 'ok' : '')));
    else if (u.online) st.appendChild(el('span', '在线', 'tag ok'));
    tr.appendChild(st);

    tr.appendChild(el('td', u.postCount, 'muted'));

    var td = el('td', null, 'actions');
    var act = function (label, action, extra, cls) {
      var b = el('button', label, 'small' + (cls ? ' ' + cls : ''));
      b.addEventListener('click', function () {
        var payload = Object.assign({ action: action, uid: u.id }, extra || {});
        if (action === 'ban' || action === 'mute') {
          var reason = window.prompt((action === 'ban' ? '封禁' : '禁言') + '「' + u.username + '」的原因（可留空）：', '');
          if (reason === null) return;
          payload.reason = reason;
        }
        /* 用户忘记密码时的兜底。密码由你直接指定，不生成随机串——
         * 随机串还得想办法交到用户手上，反而更容易被截图乱传。 */
        if (action === 'reset-password') {
          var pwd = window.prompt('把「' + u.username + '」的密码重置为（至少 6 位）：', '');
          if (pwd === null) return;
          payload.password = pwd;
        }
        api('POST', '/api/admin/user-action', payload).then(function (d) {
          if (!d.ok) return say($('uMsg'), d.error, 'err');
          say($('uMsg'), '已' + label.replace(/^\s+|\s+$/g, '') + '：' + u.username, 'ok');
          loadUsers(); loadOverview(); loadAudit();
        });
      });
      td.appendChild(b);
    };

    if (u.banned) act('解封', 'unban', null, '');
    else act('封号', 'ban', null, 'danger');

    if (u.muted) act('解除禁言', 'unmute');
    else {
      act('禁言 1 小时', 'mute', { minutes: 60 }, 'danger');
      act('禁言 7 天', 'mute', { minutes: 60 * 24 * 7 }, 'danger');
    }

    if (u.role === 'admin') act('取消管理员', 'demote');
    else act('设为管理员', 'promote');
    act('重置密码', 'reset-password');

    tr.appendChild(td);
    return tr;
  }

  function loadUsers() {
    var q = $('uQuery').value.trim();
    var f = $('uFilter').value;
    var url = '/api/admin/users?limit=' + userPage.limit + '&offset=' + userPage.offset
      + '&filter=' + encodeURIComponent(f) + '&q=' + encodeURIComponent(q);
    return api('GET', url).then(function (d) {
      var body = $('uBody');
      body.replaceChildren();
      if (!d.ok) { say($('uMsg'), d.error, 'err'); return; }
      userPage.total = d.total;
      if (!d.items.length) {
        var tr = el('tr'), td = el('td', '没有符合条件的账号', 'empty');
        td.colSpan = 6; tr.appendChild(td); body.appendChild(tr);
      } else {
        d.items.forEach(function (u) { body.appendChild(userRow(u)); });
      }
      $('uCount').textContent = '共 ' + d.total + ' 个';
      $('uPage').textContent = '第 ' + (Math.floor(userPage.offset / userPage.limit) + 1) + ' / '
        + Math.max(1, Math.ceil(d.total / userPage.limit)) + ' 页';
    });
  }

  /* ---------- 留言 ---------- */
  var postPage = { offset: 0, limit: 50 };

  function loadPosts() {
    var q = $('pQuery').value.trim();
    var f = $('pFilter').value;
    var url = '/api/admin/posts?limit=' + postPage.limit + '&offset=' + postPage.offset
      + '&filter=' + encodeURIComponent(f) + '&q=' + encodeURIComponent(q);
    return api('GET', url).then(function (d) {
      var body = $('pBody');
      body.replaceChildren();
      if (!d.ok) { say($('pMsg'), d.error, 'err'); return; }
      if (!d.items.length) {
        var tr = el('tr'), td = el('td', '没有符合条件的留言', 'empty');
        td.colSpan = 4; tr.appendChild(td); body.appendChild(tr);
      }
      d.items.forEach(function (p) {
        var tr = el('tr');
        var who = el('td');
        who.appendChild(el('div', p.author.nick));
        who.appendChild(el('div', p.author.username, 'muted'));
        tr.appendChild(who);

        var content = el('td');
        content.appendChild(el('div', p.deleted ? '（已下架，正文已清空）' : p.text));
        if (p.qid) content.appendChild(el('div', '题目 ' + p.qid, 'muted'));
        tr.appendChild(content);
        tr.appendChild(el('td', when(p.createdAt), 'muted'));

        var td = el('td', null, 'actions');
        var b = el('button', p.deleted ? '恢复' : '下架', 'small' + (p.deleted ? '' : ' danger'));
        b.addEventListener('click', function () {
          if (!p.deleted && !window.confirm('确认下架这条留言？')) return;
          api('POST', '/api/admin/post-action', { action: p.deleted ? 'restore' : 'delete', id: p.id }).then(function (r) {
            if (!r.ok) return say($('pMsg'), r.error, 'err');
            say($('pMsg'), p.deleted ? '已恢复' : '已下架', 'ok');
            loadPosts(); loadOverview(); loadAudit();
          });
        });
        td.appendChild(b);
        tr.appendChild(td);
        body.appendChild(tr);
      });
      $('pCount').textContent = '共 ' + d.total + ' 条';
      $('pPage').textContent = '第 ' + (Math.floor(postPage.offset / postPage.limit) + 1) + ' / '
        + Math.max(1, Math.ceil(d.total / postPage.limit)) + ' 页';
    });
  }

  /* ---------- 公开 AI 回答 ---------- */
  var notePage = { offset: 0, limit: 50, total: 0 };
  var NOTE_KINDS = { explain: 'AI 讲题', gen: 'AI 出题', plan: '备考计划' };

  function loadNotes() {
    var q = $('nQuery').value.trim();
    var url = '/api/admin/ai-notes?limit=' + notePage.limit + '&offset=' + notePage.offset
      + '&q=' + encodeURIComponent(q);
    return api('GET', url).then(function (d) {
      var body = $('nBody');
      body.replaceChildren();
      if (!d.ok) { say($('nMsg'), d.error, 'err'); return; }
      notePage.total = d.total;
      if (!d.items.length) {
        var tr = el('tr'), td = el('td', q ? '没有包含「' + q + '」的回答' : '还没有人公开过 AI 回答', 'empty');
        td.colSpan = 5; tr.appendChild(td); body.appendChild(tr);
      }
      d.items.forEach(function (n) {
        var tr = el('tr');

        var who = el('td');
        who.appendChild(el('div', n.author.nick));
        /* 显示名已经统一成用户名了，两行一样的字只是噪音 */
        if (n.author.username !== n.author.nick) who.appendChild(el('div', n.author.username, 'muted'));
        tr.appendChild(who);

        tr.appendChild(el('td', NOTE_KINDS[n.kind] || n.kind));

        /* 正文一律走 textContent：这是学生自己生成再公开的内容，不能当成 HTML 塞进来 */
        var content = el('td');
        content.appendChild(el('div', n.question));
        var det = el('details');
        det.appendChild(el('summary', '展开回答'));
        det.appendChild(el('div', n.answer, 'answer'));
        content.appendChild(det);
        tr.appendChild(content);

        tr.appendChild(el('td', when(n.createdAt), 'muted'));

        var td2 = el('td', null, 'actions');
        var b = el('button', '下架', 'small danger');
        b.addEventListener('click', function () {
          if (!window.confirm('确认下架这条公开回答？\n\n学生的「大家问过的」里会立刻消失，内容不留副本，不能恢复。')) return;
          api('POST', '/api/admin/ai-note-action', { action: 'delete', id: n.id }).then(function (r) {
            if (!r.ok) return say($('nMsg'), r.error, 'err');
            say($('nMsg'), '已下架', 'ok');
            /* 删掉最后一条时往前翻一页，否则会停在空页上 */
            if (notePage.offset > 0 && notePage.offset >= notePage.total - 1) {
              notePage.offset = Math.max(0, notePage.offset - notePage.limit);
            }
            loadNotes(); loadOverview(); loadAudit();
          });
        });
        td2.appendChild(b);
        tr.appendChild(td2);

        body.appendChild(tr);
      });
      $('nCount').textContent = '共 ' + d.total + ' 条';
      $('nPage').textContent = '第 ' + (Math.floor(notePage.offset / notePage.limit) + 1) + ' / '
        + Math.max(1, Math.ceil(d.total / notePage.limit)) + ' 页';
    });
  }

  /* ---------- 审计 ---------- */
  var ACTIONS = {
    ban: '封号', unban: '解封', mute: '禁言', unmute: '解除禁言',
    promote: '设为管理员', demote: '取消管理员', 'reset-password': '重置密码',
    'unify-nicks': '统一显示名',
    'post-delete': '下架留言', 'post-restore': '恢复留言',
    'ai-note-delete': '下架 AI 回答'
  };

  function loadAudit() {
    return api('GET', '/api/admin/audit?limit=100').then(function (d) {
      var body = $('aBody');
      body.replaceChildren();
      if (!d.ok) return;
      if (!d.items.length) {
        var tr = el('tr'), td = el('td', '还没有任何管理操作', 'empty');
        td.colSpan = 5; tr.appendChild(td); body.appendChild(tr);
        return;
      }
      d.items.forEach(function (it) {
        var tr = el('tr');
        tr.appendChild(el('td', when(it.at), 'muted'));
        tr.appendChild(el('td', it.actor ? it.actor.username : '—'));
        tr.appendChild(el('td', ACTIONS[it.action] || it.action));
        tr.appendChild(el('td', it.target ? it.target.username : '—', 'muted'));
        tr.appendChild(el('td', it.detail || '', 'muted'));
        body.appendChild(tr);
      });
    });
  }

  /* ---------- 启动 ---------- */
  function refreshAll() {
    loadUsers(); loadPosts(); loadNotes(); loadAudit(); loadOverview();
  }

  $('refresh').addEventListener('click', refreshAll);
  $('uSearch').addEventListener('click', function () { userPage.offset = 0; loadUsers(); });
  $('uUnifyNicks').addEventListener('click', function () {
    if (!confirm('把所有账号的显示名改成各自的用户名？\n\n留言板、学习搭子、自习室里显示的名字都会跟着变，改完不能撤销。')) return;
    api('POST', '/api/admin/unify-nicks').then(function (d) {
      if (!d.ok) return say($('uMsg'), d.error, 'err');
      say($('uMsg'), d.changed ? ('已统一 ' + d.changed + ' 个账号的显示名') : '所有账号的显示名已经是用户名', 'ok');
      loadUsers(); loadOverview(); loadAudit();
    });
  });
  $('uFilter').addEventListener('change', function () { userPage.offset = 0; loadUsers(); });
  $('pSearch').addEventListener('click', function () { postPage.offset = 0; loadPosts(); });
  $('pFilter').addEventListener('change', function () { postPage.offset = 0; loadPosts(); });
  $('nSearch').addEventListener('click', function () { notePage.offset = 0; loadNotes(); });
  $('nQuery').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); notePage.offset = 0; loadNotes(); }
  });
  $('uPrev').addEventListener('click', function () { userPage.offset = Math.max(0, userPage.offset - userPage.limit); loadUsers(); });
  $('uNext').addEventListener('click', function () { if (userPage.offset + userPage.limit < userPage.total) { userPage.offset += userPage.limit; loadUsers(); } });
  $('pPrev').addEventListener('click', function () { postPage.offset = Math.max(0, postPage.offset - postPage.limit); loadPosts(); });
  $('pNext').addEventListener('click', function () { postPage.offset += postPage.limit; loadPosts(); });
  $('nPrev').addEventListener('click', function () { notePage.offset = Math.max(0, notePage.offset - notePage.limit); loadNotes(); });
  $('nNext').addEventListener('click', function () { if (notePage.offset + notePage.limit < notePage.total) { notePage.offset += notePage.limit; loadNotes(); } });

  $('logout').addEventListener('click', function () {
    localStorage.removeItem(TOKEN_KEY);
    $('lgPass').value = '';
    showLogin('已退出登录。');
  });

  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = $('lgUser').value.trim();
    var p = $('lgPass').value;
    var m = $('lgMsg');
    if (!u || !p) {
      m.textContent = '请输入用户名和密码';
      m.className = 'msg show err';
      return;
    }
    var btn = $('lgSubmit');
    btn.disabled = true;
    btn.textContent = '登录中…';
    api('POST', '/api/admin/login', { username: u, password: p }).then(function (d) {
      btn.disabled = false;
      btn.textContent = '登 录';
      if (!d.ok) {
        m.textContent = d.error || '登录失败';
        m.className = 'msg show err';
        $('lgPass').value = '';
        return;
      }
      localStorage.setItem(TOKEN_KEY, d.token);
      m.textContent = '';
      m.className = 'msg';
      $('lgPass').value = '';
      showConsole(d.user);
    });
  });

  /* 有 token 就先验一下还能不能用；过期或角色不对就退回登录页 */
  (function boot() {
    /* 纯静态托管（GitHub Pages / Gitee Pages）上没有后端，同源请求必然打空。
       这种情况直接说清楚怎么接后端，而不是让人对着「账号或密码错误」猜。 */
    if (!API_BASE && STATIC_HOST) {
      showLogin('这个地址只是纯静态托管，页面连不到后端。请改用后端的地址打开（例如 https://你的后端域名/admin.html），'
        + '或者在当前地址后面加上 ?api=https://你的后端域名 。');
      return;
    }
    if (!API_BASE && location.protocol === 'file:') {
      showLogin('不要直接双击打开这个文件。请通过后端地址访问，或加 ?api=http://127.0.0.1:3000 。');
      return;
    }
    if (!localStorage.getItem(TOKEN_KEY)) { showLogin(); return; }
    api('GET', '/api/auth/me').then(function (d) {
      if (d.ok && d.user && d.user.role === 'admin') { showConsole(d.user); return; }
      localStorage.removeItem(TOKEN_KEY);
      showLogin(d.__status === 401
        ? '登录已失效，请重新登录。'
        : '「' + ((d.user && d.user.username) || '未知账号') + '」不是管理员。管理员身份由维护者用 grant-admin.js 指定。');
    });
  })();
})();
</script>
</body>
</html>
