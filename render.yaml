# Free web service + external Neon PostgreSQL. No paid disk or database required.
services:
  - type: web
    name: xuewuyou-campus
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/server/data
      - key: LEARNING_PYTHON
        value: /opt/learning/bin/python
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://dallovers.github.io
