<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>社交广场 · 板块 A 预览</title>
<link rel="stylesheet" href="./preview-activities.css" />
<link rel="stylesheet" href="./preview-community.css" />
<link rel="stylesheet" href="../../../css/feature-social.css" />
<style>
  html, body { margin: 0; height: 100%; background: #1d2320; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="社交广场，WASD 行走，E 互动"></canvas>

<div class="social-ui" id="ui" hidden>
  <div class="social-ui__badge">
    <b>社交广场 · 板块 A</b>
    <span>WASD 移动 · 拖动环顾 · 服务台找搭子，留言板贴便签 · 靠近按 E</span>
  </div>

  <div class="social-ui__crosshair"></div>

  <div class="social-ui__hint" id="hint">
    <span class="social-ui__key">E</span>
    <span><em id="hintLabel"></em><span id="hintPrompt"></span></span>
  </div>

  <aside class="social-ui__panel" id="panel" hidden aria-live="polite">
    <div class="social-ui__panel-head">
      <div>
        <h2 id="panelTitle">面板</h2>
        <p id="panelSub"></p>
      </div>
      <button class="social-ui__close" id="panelClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="social-ui__panel-body" id="panelBody"></div>
  </aside>

  <div class="social-ui__debug" id="debug"></div>
</div>

<div class="social-ui__fatal" id="fatal" hidden></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import {createPreviewCommunity} from './preview-community.js';
const fatal = document.getElementById('fatal');
function fail(err) {
  fatal.hidden = false;
  fatal.innerHTML = '预览未能启动：<br><b>' + String(err && err.message || err) + '</b>' +
    '<br><br>常见原因：<br>① 用 file:// 直接打开（ESM 必需 http）<br>' +
    '② 无法访问 unpkg.com 取 three.js<br>③ 浏览器未启用 WebGL';
  console.error(err);
}

let THREE, createDistrict, SOCIAL_LAYOUT, createPreviewActivities;
try {
  THREE = await import('three');
  ({createPreviewActivities}=await import('./preview-activities.js'));
  ({ createDistrict, SOCIAL_LAYOUT } = await import('./social-district.js'));
} catch (err) {
  fail(err);
  throw err;
}

/* ---------- 渲染器：仅预览用的宿主，主站不引这一段 ---------- */

const canvas = document.getElementById('view');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (err) {
  fail(new Error('WebGL 初始化失败：' + (err && err.message)));
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc6dae4);
scene.fog = new THREE.Fog(0xc6dae4, 30, 70);

/* 天空 HDR → 环境反射（IBL）。
   没有环境贴图时，metalness 偏高的材质（亭廊立柱、窗框、栏杆）只能渲染成死黑，
   这是之前"塑料/发灰"最直接的来源。加载失败就退回纯色背景，预览照常跑。 */
let envState = { ok: false, reason: 'not-started' };
let previewHDR=null,previewEnvironmentTarget=null;
try {
  const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js');
  const hdr = await new RGBELoader().loadAsync('../../../examples/campus-3d-v5/assets/sky.hdr');
  previewHDR=hdr;
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = hdr;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  previewEnvironmentTarget=pmrem.fromEquirectangular(hdr);
  scene.environment=previewEnvironmentTarget.texture;
  pmrem.dispose();
  envState = { ok: true, source: 'sky.hdr' };
} catch (err) {
  envState = { ok: false, reason: err && err.message };
  console.warn('[preview] 天空 HDR 未加载，回退纯色背景与环境', err);
}

/* 相机按等效全画幅焦距换算，不把"35mm"直接当 FOV 填进去。
   36×24 画幅：垂直 FOV = 2·atan(12/mm)。35mm → 37.8°，40mm → 33.4°，50mm → 27.0°。
   ?mm=40 覆盖焦距，?fov=xx 直接指定垂直 FOV（调试用）。 */
const qs = new URLSearchParams(location.search);
function fovFromMm(mm) { return 2 * Math.atan(12 / mm) * 180 / Math.PI; }
const EQUIV_MM = qs.has('mm') ? parseFloat(qs.get('mm')) : 35;
const CAMERA_FOV = qs.has('fov') ? parseFloat(qs.get('fov')) : fovFromMm(EQUIV_MM);

const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.1, 240);
camera.rotation.order = 'YXZ';

// 有 IBL 之后半球光要压下来，否则整体过曝、阴影细节被冲掉
const hemi = new THREE.HemisphereLight(0xdfeaf2, 0x6f7564, envState.ok ? 0.24 : 1.05);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3de, envState.ok ? 3.2 : 2.1);
sun.position.set(-7.2 + 16, 24, -1.0 + 13);
// 主光指向亭廊样板中心，阴影相机只覆盖样板范围：
// 跨度从 52m 收到 20m，2048 贴图下每像素从 2.5cm 变成 1cm，近景接触阴影才有细节
sun.target.position.set(-7.2, 1.6, -1.0);
sun.castShadow = true;
// All district geometry is static: render its shadow map once, not again for the AO pass.
sun.shadow.autoUpdate = false;
sun.shadow.needsUpdate = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
// 贴近 v5 的取值：bias 过大会让阴影脱离物体（浮空），过小会出现条纹
sun.shadow.bias = -0.00004;
sun.shadow.normalBias = 0.012;
sun.shadow.radius = 2;
scene.add(sun.target);
scene.add(sun);

const fill = new THREE.DirectionalLight(0xdce8ef, envState.ok ? 0.08 : 0.6);
fill.position.set(-14, 9, -10);
scene.add(fill);

/* Preview rendering only: no business/UI changes. Exposure remains 0.86. */
let previewRendering = null;
if (qs.get('ao') !== '0') {
  try {
    const { createSocialPreviewRendering } = await import('./preview-rendering.js');
    previewRendering = createSocialPreviewRendering(renderer,scene,camera);
  } catch (err) { console.warn('[social] 接触阴影不可用，回退标准渲染',err); }
}
function renderPreview() { if (previewRendering) previewRendering.render(); else renderer.render(scene,camera); }

/* ---------- 空间 ---------- */

// This adapter belongs to this standalone preview; D's public host supplies its own openFeature.
const communityPreview = createPreviewCommunity({
  onPause() {
    panelOpen=true; dragging=false;
    for(const k of Object.keys(keys)) keys[k]=false;
    hintEl.classList.remove('is-on');
  },
  onResume() { closePanel(); },
});
const openPreviewFeature = (name, options) => communityPreview.openFeature(name, options);
const district = createDistrict({ THREE, mode: 'preview', openFeature: openPreviewFeature });
scene.add(district.root);
let previewDisposed=false;
const districtAssetsReady=district.ready;
district.ready=districtAssetsReady.then(async r=>{
  const {installSocialSkyFog}=await import('./preview-fog.js');
  if(previewDisposed)return r;
  installSocialSkyFog(district.root,scene.background);
  sun.shadow.needsUpdate=true;
  console.log('[preview] PBR 贴图',r,'环境',envState);return r;
});

/* ---------- 第一人称行走（预览自用） ---------- */

const PLAYER = { x: 0, z: 7.6, y: 1.6, speed: 4.2, run: 6.6, radius: 0.35 };
let yaw = 0; // 朝北（-Z），从南入口看向广场
let pitch = -0.10;

/* 调试定位：?x=-5&z=2&yaw=-90&pitch=-6&mm=35（角度制），方便直接站到某个构件前检查 */
if (qs.has('x')) PLAYER.x = parseFloat(qs.get('x')) || 0;
if (qs.has('z')) PLAYER.z = parseFloat(qs.get('z')) || 0;
if (qs.has('h')) PLAYER.y = parseFloat(qs.get('h')) || PLAYER.y;
if (qs.has('yaw')) yaw = (parseFloat(qs.get('yaw')) || 0) * Math.PI / 180;
if (qs.has('pitch')) pitch = (parseFloat(qs.get('pitch')) || 0) * Math.PI / 180;

const keys = Object.create(null);
let dragging = false;
let lastX = 0, lastY = 0;
let panelOpen = false;
let activities=null;

canvas.addEventListener('pointerdown', (e) => {
  if (panelOpen) return;
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging || panelOpen) return;
  yaw -= (e.clientX - lastX) * 0.0026;
  pitch -= (e.clientY - lastY) * 0.0026;
  pitch = Math.max(-1.1, Math.min(1.1, pitch));
  lastX = e.clientX;
  lastY = e.clientY;
});
canvas.addEventListener('pointerup', (e) => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointercancel', () => { dragging = false; });

window.addEventListener('keydown', (e) => {
  if(e.code==='Escape' && panelOpen && !communityPreview.opened){e.preventDefault();closePanel();return;}
  if(e.target.closest?.('input,textarea,select,button,dialog'))return;
  if(e.repeat && e.code==='KeyE')return;
  if(activities?.seated && (e.code==='KeyE'||e.code==='Escape')){e.preventDefault();activities.stand();return;}
  if(activities?.seated)return;
  if (e.code === 'Escape') {
    if (panelOpen) closePanel();
    return;
  }
  if (panelOpen) return;
  if (e.code === 'KeyE') {
    if (current) { e.preventDefault(); trigger(current); }
    return;
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for (const k of Object.keys(keys)) keys[k] = false;
  dragging = false;
});

/* 圆-盒 / 圆-柱 推开，避免穿墙穿台 */
function collide(pos) {
  const yLo = pos.y - 1.6, yHi = pos.y + 0.1;
  for (const c of district.colliders) {
    if (c.type === 'box') {
      const [cx, cy, cz] = c.center;
      const [hx, hy, hz] = c.half;
      if (yHi < cy - hy || yLo > cy + hy) continue;
      const nx = Math.max(cx - hx, Math.min(pos.x, cx + hx));
      const nz = Math.max(cz - hz, Math.min(pos.z, cz + hz));
      const dx = pos.x - nx, dz = pos.z - nz;
      const d2 = dx * dx + dz * dz;
      const R = PLAYER.radius;
      if (d2 >= R * R) continue;
      if (d2 < 1e-8) {
        const px = hx - Math.abs(pos.x - cx);
        const pz = hz - Math.abs(pos.z - cz);
        if (px < pz) pos.x = cx + (pos.x >= cx ? 1 : -1) * (hx + R);
        else pos.z = cz + (pos.z >= cz ? 1 : -1) * (hz + R);
      } else {
        const d = Math.sqrt(d2);
        pos.x = nx + (dx / d) * R;
        pos.z = nz + (dz / d) * R;
      }
    } else if (c.type === 'cylinder') {
      const [cx, cy, cz] = c.center;
      const halfH = (c.height || 1) / 2;
      if (yHi < cy - halfH || yLo > cy + halfH) continue;
      const dx = pos.x - cx, dz = pos.z - cz;
      const d = Math.hypot(dx, dz);
      const min = c.radius + PLAYER.radius;
      if (d < min && d > 1e-6) {
        pos.x = cx + (dx / d) * min;
        pos.z = cz + (dz / d) * min;
      }
    }
  }
  // 场地边界，别走出铺装
  const bx = SOCIAL_LAYOUT.site.w / 2 - 0.6;
  const bz = SOCIAL_LAYOUT.site.d / 2 - 0.6;
  pos.x = Math.max(-bx, Math.min(bx, pos.x));
  pos.z = Math.max(-bz, Math.min(bz, pos.z));
}

/* ---------- 靠近提示 ---------- */

const ui = document.getElementById('ui');
const hintEl = document.getElementById('hint');
const hintLabel = document.getElementById('hintLabel');
const hintPrompt = document.getElementById('hintPrompt');
const debugEl = document.getElementById('debug');
const panelEl = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const panelSub = document.getElementById('panelSub');
const panelBody = document.getElementById('panelBody');
activities=createPreviewActivities({player:PLAYER,ui,onStand(){
  for(const k of Object.keys(keys))keys[k]=false;
  current=findNearest();hintShown=undefined;canvas.focus();
}});

let current = null;
let hintShown = null;
const tmpV = new THREE.Vector3();

function findNearest() {
  let best = null;
  let bestD = Infinity;
  for (const it of district.interactions) {
    if (!it.object) continue;
    it.object.getWorldPosition(tmpV);
    const d = Math.hypot(tmpV.x - PLAYER.x, tmpV.z - PLAYER.z);
    if (d <= (it.radius || 2.5) && d < bestD) {
      bestD = d;
      best = it;
    }
  }
  return best;
}

const LIVE = true; // Main-site iframe adapter; the backend may still require login or retry.

const PANEL_COPY = {
  'social.challenge': {
    title: '双人竞技桌',
    sub: '竞技功能暂不接入',
    body: () => `<p>这里保留竞技桌，本轮先开放学习搭子和校园留言。</p>`,
  },

};

function openPanel(it, result) {
  const copy = PANEL_COPY[it.id] || { title: it.label, sub: '', body: () => '' };
  panelTitle.textContent = copy.title;
  panelSub.textContent = copy.sub;
  panelBody.innerHTML = copy.body();
  panelEl.hidden = false;
  panelOpen = true;
  hintEl.classList.remove('is-on');
}

function closePanel() {
  if(communityPreview.opened){communityPreview.close();return;}
  panelEl.hidden = true;
  panelOpen = false;
  current = null;
  // 必须清掉提示缓存：否则下一帧算出的 key 与缓存相同，提示不会重新出现
  // （E → Esc → 原地不动时会停在"面板关了但提示也没了"的状态）
  hintShown = undefined;
  // 关闭后恢复行走：清空按键并交回指针
  for (const k of Object.keys(keys)) keys[k] = false;
  dragging = false;
  canvas.focus && canvas.focus();
}

document.getElementById('panelClose').addEventListener('click', closePanel);
panelEl.addEventListener('pointerdown', (e) => e.stopPropagation());

async function trigger(it) {
  if(it.id==='social.challenge'){openPanel(it);return;}
  let result;
  try {
    result = await it.action();
  } catch (err) {
    result = { ok: false, message: String(err && err.message || err) };
  }
  if(result?.ok && result.kind==='seat'){
    for(const k of Object.keys(keys))keys[k]=false;
    const facing=activities.sit(result);if(facing!==null){yaw=facing;pitch=-.08;}
    current=null;hintShown=undefined;hintEl.classList.remove('is-on');return;
  }
  if(result?.ok && result.kind==='fountain'){activities.notify(result.message);hintShown=undefined;return;}
  if(it.id==='social.desk'||it.id==='social.board'){
    // The real panel owns its loading/error state. A close during load is cancellation.
    if(!result?.ok && !['closed','already-open','main-site-unavailable'].includes(result?.reason)) activities.notify(result?.message||'暂时无法打开社区');
    return;
  }
  openPanel(it, result);
}

/* ---------- 主循环：唯一的 RAF，在这里 ---------- */

let rafId = 0;
let last = performance.now();
let frames = 0;
let fpsAcc = 0;
let fps = 0;

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  if (previewRendering) previewRendering.resize(w,h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  if (!panelOpen && !activities.seated) {
    let f = 0, r = 0;
    if (keys.KeyW || keys.ArrowUp) f += 1;
    if (keys.KeyS || keys.ArrowDown) f -= 1;
    if (keys.KeyD || keys.ArrowRight) r += 1;
    if (keys.KeyA || keys.ArrowLeft) r -= 1;
    if (f || r) {
      const len = Math.hypot(f, r) || 1;
      const speed = (keys.ShiftLeft || keys.ShiftRight ? PLAYER.run : PLAYER.speed) * dt / len;
      const sin = Math.sin(yaw), cos = Math.cos(yaw);
      PLAYER.x += (-sin * f + cos * r) * speed;
      PLAYER.z += (-cos * f - sin * r) * speed;
      collide(PLAYER);
    }
    if (keys.KeyJ) yaw += dt * 1.6;
    if (keys.KeyL) yaw -= dt * 1.6;
  }

  activities.update(dt);
  camera.position.set(PLAYER.x, PLAYER.y, PLAYER.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  district.update(dt);

  if (!panelOpen && !activities.seated) {
    const near = findNearest();
    current = near;
    const key = near ? near.id : null;
    if (key !== hintShown) {
      hintShown = key;
      if (near) {
        hintLabel.textContent = near.label + ' · ';
        hintPrompt.textContent = near.prompt.replace(/^按 E\s*/, '');
        hintEl.classList.add('is-on');
      } else {
        hintEl.classList.remove('is-on');
      }
    }
  }

  frames++;
  fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    fps = Math.round(frames / fpsAcc);
    frames = 0;
    fpsAcc = 0;
    debugEl.textContent =
      'x ' + PLAYER.x.toFixed(2) + '  z ' + PLAYER.z.toFixed(2) + '  h ' + PLAYER.y.toFixed(2) +
      '\nyaw ' + (yaw * 180 / Math.PI).toFixed(1) + '°  pitch ' + (pitch * 180 / Math.PI).toFixed(1) + '°' +
      '\nfov ' + CAMERA_FOV.toFixed(1) + '° ≈' + EQUIV_MM + 'mm  fps ' + fps +
      '\n碰撞体 ' + district.colliders.length + '  交互点 ' + district.interactions.length +
      '\n' + (LIVE ? '主站好友 / 留言面板 · 竞技暂未接入' : '预览替身（未接主站）');
  }

  renderPreview();
  rafId = requestAnimationFrame(tick);
}

/* 先同步画一帧：避免 rAF 启动前出现一帧空白（截图/慢设备都受益） */
camera.position.set(PLAYER.x, PLAYER.y, PLAYER.z);
camera.rotation.set(pitch, yaw, 0, 'YXZ');
district.update(0);
renderPreview();

ui.hidden = false;
// 截图用：?hud=0 隐藏所有覆盖层，不改交互与入口
if (qs.get('hud') === '0') ui.hidden = true;
rafId = requestAnimationFrame(tick);

/* 供自动化检查用：读当前交互点、强制触发一次（不改变主站行为） */
window.__social = {
  district,
  player: PLAYER,
  renderer,
  camera,
  get current() { return current; },
  get panelOpen() { return panelOpen; },
  get seated() { return activities.seated; },
  get fov() { return CAMERA_FOV; },
  get env() { return envState; },
  interact() { if (current) trigger(current); return current ? current.id : null; },
  close() { closePanel(); },
};

/* 离开页面时清理，避免预览页反复热重载后堆积定时器与 WebGL 上下文 */
window.addEventListener('beforeunload', () => {
  previewDisposed=true;
  cancelAnimationFrame(rafId);
  communityPreview.dispose();
  activities.dispose();
  district.dispose();
  if (previewRendering) previewRendering.dispose();
  if(previewEnvironmentTarget)previewEnvironmentTarget.dispose();
  if(previewHDR)previewHDR.dispose();
  scene.environment=null;scene.background=null;
  renderer.dispose();
  renderer.forceContextLoss();
});
</script>
</body>
</html>
