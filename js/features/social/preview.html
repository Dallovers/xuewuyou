  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }

<body>
<canvas id="view"></canvas>

<div class="social-ui" id="ui" hidden>
  <div class="social-ui__badge">
    <b>社交广场 · 板块 A</b>

  </div>

    <span class="social-ui__key">E</span>

  </aside>

  <div class="social-ui__debug" id="debug"></div>
</div>

<div class="social-ui__fatal" id="fatal" hidden></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
const fatal = document.getElementById('fatal');
function fail(err) {
  fatal.hidden = false;
  fatal.innerHTML = '预览未能启动：<br><b>' + String(err && err.message || err) + '</b>' +
    '<br><br>常见原因：<br>① 用 file:// 直接打开（ESM 必需 http）<br>' +
    '② 无法访问 unpkg.com 取 three.js<br>③ 浏览器未启用 WebGL';
  console.error(err);
}

let THREE, createDistrict, SOCIAL_LAYOUT;
try {
  THREE = await import('three');
  ({ createDistrict, SOCIAL_LAYOUT } = await import('./social-district.js'));
} catch (err) {
  fail(err);
  throw err;
}

/* ---------- 渲染器：仅预览用的宿主，主站不引这一段 ---------- */

const canvas = document.getElementById('view');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (err) {
  fail(new Error('WebGL 初始化失败：' + (err && err.message)));
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc6dae4);
scene.fog = new THREE.Fog(0xc6dae4, 46, 112);

/* 天空 HDR → 环境反射（IBL）。
   没有环境贴图时，metalness 偏高的材质（亭廊立柱、窗框、栏杆）只能渲染成死黑，
   这是之前"塑料/发灰"最直接的来源。加载失败就退回纯色背景，预览照常跑。 */
let envState = { ok: false, reason: 'not-started' };
try {
  const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js');
  const hdr = await new RGBELoader().loadAsync('../../../examples/campus-3d-v5/assets/sky.hdr');
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = hdr;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  pmrem.dispose();
  envState = { ok: true, source: 'sky.hdr' };
} catch (err) {
  envState = { ok: false, reason: err && err.message };
  console.warn('[preview] 天空 HDR 未加载，回退纯色背景与环境', err);
}

/* 相机按等效全画幅焦距换算，不把"35mm"直接当 FOV 填进去。
   36×24 画幅：垂直 FOV = 2·atan(12/mm)。35mm → 37.8°，40mm → 33.4°，50mm → 27.0°。
   ?mm=40 覆盖焦距，?fov=xx 直接指定垂直 FOV（调试用）。 */
const qs = new URLSearchParams(location.search);
function fovFromMm(mm) { return 2 * Math.atan(12 / mm) * 180 / Math.PI; }
const EQUIV_MM = qs.has('mm') ? parseFloat(qs.get('mm')) : 35;
const CAMERA_FOV = qs.has('fov') ? parseFloat(qs.get('fov')) : fovFromMm(EQUIV_MM);

const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.1, 240);
camera.rotation.order = 'YXZ';

// 有 IBL 之后半球光要压下来，否则整体过曝、阴影细节被冲掉
const hemi = new THREE.HemisphereLight(0xdfeaf2, 0x6f7564, envState.ok ? 0.42 : 1.05);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3de, envState.ok ? 2.2 : 2.1);
sun.position.set(-7.2 + 16, 24, -1.0 + 13);
// 主光指向亭廊样板中心，阴影相机只覆盖样板范围：
// 跨度从 52m 收到 20m，2048 贴图下每像素从 2.5cm 变成 1cm，近景接触阴影才有细节
sun.target.position.set(-7.2, 1.6, -1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
// 贴近 v5 的取值：bias 过大会让阴影脱离物体（浮空），过小会出现条纹
sun.shadow.bias = -0.00004;
sun.shadow.normalBias = 0.012;
sun.shadow.radius = 2;
scene.add(sun.target);
scene.add(sun);

const fill = new THREE.DirectionalLight(0xdce8ef, envState.ok ? 0.16 : 0.6);
fill.position.set(-14, 9, -10);
scene.add(fill);

/* ---------- 空间 ---------- */

const district = createDistrict({ THREE, mode: 'preview' });
scene.add(district.root);
district.ready.then((r) => console.log('[preview] PBR 贴图', r, '环境', envState));

/* ---------- 第一人称行走（预览自用） ---------- */

const PLAYER = { x: 0, z: 7.6, y: 1.6, speed: 4.2, run: 6.6, radius: 0.35 };
let yaw = 0; // 朝北（-Z），从南入口看向广场
let pitch = -0.10;

/* 调试定位：?x=-5&z=2&yaw=-90&pitch=-6&mm=35（角度制），方便直接站到某个构件前检查 */
if (qs.has('x')) PLAYER.x = parseFloat(qs.get('x')) || 0;
if (qs.has('z')) PLAYER.z = parseFloat(qs.get('z')) || 0;
if (qs.has('h')) PLAYER.y = parseFloat(qs.get('h')) || PLAYER.y;
if (qs.has('yaw')) yaw = (parseFloat(qs.get('yaw')) || 0) * Math.PI / 180;
if (qs.has('pitch')) pitch = (parseFloat(qs.get('pitch')) || 0) * Math.PI / 180;

const keys = Object.create(null);
let dragging = false;
let lastX = 0, lastY = 0;
let panelOpen = false;

canvas.addEventListener('pointerdown', (e) => {
  if (panelOpen) return;
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging || panelOpen) return;
  yaw -= (e.clientX - lastX) * 0.0026;
  pitch -= (e.clientY - lastY) * 0.0026;
  pitch = Math.max(-1.1, Math.min(1.1, pitch));
  lastX = e.clientX;
  lastY = e.clientY;
});
canvas.addEventListener('pointerup', (e) => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointercancel', () => { dragging = false; });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    if (panelOpen) closePanel();
    return;
  }
  if (panelOpen) return;
  if (e.code === 'KeyE') {
    if (current) { e.preventDefault(); trigger(current); }
    return;
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for (const k of Object.keys(keys)) keys[k] = false;
  dragging = false;
});

/* 圆-盒 / 圆-柱 推开，避免穿墙穿台 */
function collide(pos) {
  const yLo = pos.y - 1.6, yHi = pos.y + 0.1;
  for (const c of district.colliders) {
    if (c.type === 'box') {
      const [cx, cy, cz] = c.center;
      const [hx, hy, hz] = c.half;
      if (yHi < cy - hy || yLo > cy + hy) continue;
      const nx = Math.max(cx - hx, Math.min(pos.x, cx + hx));
      const nz = Math.max(cz - hz, Math.min(pos.z, cz + hz));
      const dx = pos.x - nx, dz = pos.z - nz;
      const d2 = dx * dx + dz * dz;
      const R = PLAYER.radius;
      if (d2 >= R * R) continue;
      if (d2 < 1e-8) {
        const px = hx - Math.abs(pos.x - cx);
        const pz = hz - Math.abs(pos.z - cz);
        if (px < pz) pos.x = cx + (pos.x >= cx ? 1 : -1) * (hx + R);
        else pos.z = cz + (pos.z >= cz ? 1 : -1) * (hz + R);
      } else {
        const d = Math.sqrt(d2);
        pos.x = nx + (dx / d) * R;
        pos.z = nz + (dz / d) * R;
      }
    } else if (c.type === 'cylinder') {
      const [cx, cy, cz] = c.center;
      const halfH = (c.height || 1) / 2;
      if (yHi < cy - halfH || yLo > cy + halfH) continue;
      const dx = pos.x - cx, dz = pos.z - cz;
      const d = Math.hypot(dx, dz);
      const min = c.radius + PLAYER.radius;
      if (d < min && d > 1e-6) {
        pos.x = cx + (dx / d) * min;
        pos.z = cz + (dz / d) * min;
      }
    }
  }
  // 场地边界，别走出铺装
  const bx = SOCIAL_LAYOUT.site.w / 2 - 0.6;
  const bz = SOCIAL_LAYOUT.site.d / 2 - 0.6;
  pos.x = Math.max(-bx, Math.min(bx, pos.x));
  pos.z = Math.max(-bz, Math.min(bz, pos.z));
}

/* ---------- 靠近提示 ---------- */

const ui = document.getElementById('ui');
const hintEl = document.getElementById('hint');
const hintLabel = document.getElementById('hintLabel');
const hintPrompt = document.getElementById('hintPrompt');
const debugEl = document.getElementById('debug');
const panelEl = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const panelSub = document.getElementById('panelSub');
const panelBody = document.getElementById('panelBody');

let current = null;
let hintShown = null;
const tmpV = new THREE.Vector3();

function findNearest() {
  let best = null;
  let bestD = Infinity;
  for (const it of district.interactions) {
    if (!it.object) continue;
    it.object.getWorldPosition(tmpV);
    const d = Math.hypot(tmpV.x - PLAYER.x, tmpV.z - PLAYER.z);
    if (d <= (it.radius || 2.5) && d < bestD) {
      bestD = d;
      best = it;
    }
  }
  return best;
}

const LIVE = typeof window.WG_Community !== 'undefined' && typeof window.WG_Community.open === 'function';

const PANEL_COPY = {
  'social.desk': {
    title: '学习搭子',
    sub: '服务台 → 真实搭子列表',
    body: () => `
      <p>在主站中，这里会调用：</p>
      <code>WG_Community.open('friends')</code>
      <p>它内部会依次执行 <b>tab('friends')</b> → <b>StudyAppBridge.navTo('community')</b> → <b>WG_Community.load()</b>，
      这条链路已在 main 分支确认存在，不需要等公共 openFeature 落地。</p>
      <p><span class="social-ui__tag">验收闭环</span> 搭子列表 → 发申请 → 另一账号接受 → 好友列表更新</p>
      <div class="social-ui__note">本页是独立预览，没有主站的社区 DOM，所以上面这段调用意图在这里会返回 <b>no-bridge</b>；下方是直连同一套 <code>/api/community</code> 接口的真实数据视图。</div>

  'social.board': {

    body: () => `

      <p>展板是独立可替换件（<b>board:panel</b>），文字不烘进墙体贴图；贴纸、便签由 <b>js/community.js</b> 渲染，3D 侧只负责打开。</p>
      <p><span class="social-ui__tag">验收闭环</span> 查看留言 → 发布留言 → 另一账号可见</p>
      <div class="social-ui__note">留言面板的样式仍由主站现有 CSS 提供，本板块不改 .sticky-note / .note-thread。下面是直连接口的真实数据视图。</div>

      <p>按统一风格约定，<b>水面与水流效果尚未实现</b>，本板块只提交开关状态，不写水面 shader 或粒子。</p>
      <p id="fountainState"><span class="social-ui__tag">当前状态</span> 水流：关闭</p>
      <div class="social-ui__note">喷泉状态与好友业务完成度无关，不复用同一套状态字段。</div>`,
  },

/* ---------- 真实业务直连（修复版） ----------
 * 替换 preview.html 中从本注释到 closePanel() 结束的整段。
 * 修复：收到邀请可接受/拒绝、发出邀请可取消、目录逐个邀请；
 *       401 清失效会话并重登；面板/账号版本 + AbortController 防串页。
 */
const API_BASE = qs.get('api') || 'http://127.0.0.1:3000';
let authToken = localStorage.getItem('social.preview.token') || '';
let authName = localStorage.getItem('social.preview.name') || '';

let panelVersion = 0;
let currentKind = null;
let authVersion = 0;
let panelAbort = null;
const panelTimers = new Set();

function beginPanelScope(kind) {
  panelVersion++;
  currentKind = kind;
  if (panelAbort) panelAbort.abort();
  panelAbort = new AbortController();
  for (const id of panelTimers) clearTimeout(id);
  panelTimers.clear();
}

function endPanelScope() {
  panelVersion++;
  currentKind = null;
  if (panelAbort) { panelAbort.abort(); panelAbort = null; }
  for (const id of panelTimers) clearTimeout(id);
  panelTimers.clear();
}

function later(fn, ms) {
  const id = setTimeout(() => { panelTimers.delete(id); fn(); }, ms);
  panelTimers.add(id);
  return id;
}

function dropSession() {
  authToken = '';
  authName = '';
  localStorage.removeItem('social.preview.token');
  localStorage.removeItem('social.preview.name');
  authVersion++;
}

async function apiCall(method, path, body, signal) {
  const res = await fetch(API_BASE + '/api/community/' + path, {
    method,
    signal,
    headers: Object.assign(
      { 'Content-Type': 'application/json' },
      authToken ? { Authorization: 'Bearer ' + authToken } : {},
    ),
    ...(body === undefined ? {} : { body: JSON.stringify(body) }),
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || ('HTTP ' + res.status));
    err.status = res.status;
    err.code = data && data.code;
    throw err;
  }
  return data;
}

function escHtml(value) {
  return String(value).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const REAL_STYLE = 'margin-top:10px;padding:10px;border:1px solid rgba(0,0,0,.14);border-radius:6px;background:rgba(255,255,255,.5)';
const REAL_INPUT = 'flex:1;min-width:0;padding:4px 6px;border:1px solid rgba(0,0,0,.2);border-radius:4px;font:inherit';

function renderLogin(box, note) {
  const myVersion = panelVersion;
  box.innerHTML =
    '<div class="social-ui__note">' + escHtml(note || '未登录：直连接口需要云端账号，登录后才能读真实好友与留言。') + '</div>' +
    '<div style="display:flex;gap:6px;margin-top:6px">' +
    '<input id="realUser" placeholder="账号" autocomplete="username" style="' + REAL_INPUT + '">' +
    '<input id="realPass" type="password" placeholder="密码" autocomplete="current-password" style="' + REAL_INPUT + '">' +
    '<button id="realLogin" type="button">登录</button></div>' +
    '<div id="realMsg" style="margin-top:6px;font-size:12px"></div>';

  document.getElementById('realLogin').onclick = async () => {
    const u = document.getElementById('realUser').value.trim();
    const p = document.getElementById('realPass').value;
    const msg = document.getElementById('realMsg');
    msg.textContent = '登录中…';
    try {
      const res = await fetch(API_BASE + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.token) throw new Error((data && data.error) || ('HTTP ' + res.status));
      if (myVersion !== panelVersion || !box.isConnected) return;
      authToken = data.token;
      authName = u;
      authVersion++;
      localStorage.setItem('social.preview.token', authToken);
      localStorage.setItem('social.preview.name', authName);
      renderReal(currentKind || 'friends');
    } catch (e) {
      msg.textContent = '登录失败：' + e.message;
    }
  };
}

async function renderReal(kind) {
  const box = document.getElementById('realPanel');
  if (!box) return;

  const myVersion = panelVersion;
  const myKind = currentKind;
  const myAuth = authVersion;
  const myToken = authToken;
  const signal = panelAbort ? panelAbort.signal : undefined;
  const alive = () => myVersion === panelVersion && myKind === currentKind &&
    myAuth === authVersion && myToken === authToken && box.isConnected;

  box.setAttribute('style', REAL_STYLE);

  if (!authToken) {
    renderLogin(box);
    return;
  }

  box.innerHTML = '<div class="social-ui__note">读取中…</div>';
  try {
    if (kind === 'friends') {
      const home = await apiCall('GET', 'home', undefined, signal);
      if (!alive()) return;

      const friends = home.friends || [];
      const requests = home.requests || [];
      const incoming = requests.filter((r) => r.to === home.uid);
      const outgoing = requests.filter((r) => r.from === home.uid);
      const pending = new Set(requests.map((r) => r.person.id));
      const directory = (home.directory || []).filter((p) => !p.isFriend && !pending.has(p.id));

      let html = '<div><b>已登录 ' + escHtml(authName) + '</b> · 学习搭子 ' + friends.length +
        ' · 待处理 ' + requests.length +
        ' <button id="realLogout" type="button" style="float:right">退出</button></div>';

      html += '<div style="margin-top:4px">' + (friends.length
        ? friends.map((p) => '<span style="margin-right:6px">· ' + escHtml(p.nick) + '</span>').join('')
        : '<em>还没有学习搭子</em>') + '</div>';

      if (incoming.length) {
        html += '<div class="social-ui__note">收到的邀请：</div>';
        html += incoming.map((r) =>
          '<div style="margin:4px 0">' + escHtml(r.person.nick) +
          ' <button data-req="' + escHtml(r.id) + '" data-act="accept" type="button">接受</button>' +
          ' <button data-req="' + escHtml(r.id) + '" data-act="reject" type="button">拒绝</button></div>'
        ).join('');
      }

      if (outgoing.length) {
        html += '<div class="social-ui__note">发出的邀请：</div>';
        html += outgoing.map((r) =>
          '<div style="margin:4px 0">等待 ' + escHtml(r.person.nick) +
          ' <button data-req="' + escHtml(r.id) + '" data-act="cancel" type="button">取消</button></div>'
        ).join('');
      }

      html += '<div class="social-ui__note">目录（可逐个邀请）：</div>';
      html += directory.length
        ? directory.map((p) =>
          '<div style="margin:4px 0">' + escHtml(p.nick) +
          ' <button data-invite="' + escHtml(p.id) + '" type="button">邀请</button></div>'
        ).join('')
        : '<div class="social-ui__note">暂无可邀请的同学</div>';

      html += '<div style="margin-top:6px"><button id="realRefresh" type="button">刷新列表</button></div>' +
        '<div id="realMsg" style="margin-top:6px;font-size:12px"></div>';

      box.innerHTML = html;

      const msg = () => document.getElementById('realMsg');

      document.getElementById('realLogout').onclick = () => {
        dropSession();
        renderLogin(box, '已退出，请重新登录。');
      };
      document.getElementById('realRefresh').onclick = () => renderReal('friends');

      box.querySelectorAll('[data-req]').forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.getAttribute('data-req');
          const act = btn.getAttribute('data-act');
          btn.disabled = true;
          if (msg()) msg().textContent = act === 'accept' ? '接受中…' : act === 'reject' ? '拒绝中…' : '取消中…';
          try {
            await apiCall('PUT', 'request', { id: id, action: act }, signal);
            if (alive()) renderReal('friends');
          } catch (e) {
            if (!alive()) return;
            if (e.status === 401) { dropSession(); renderLogin(box, '登录已失效，请重新登录。'); return; }
            if (msg()) msg().textContent = '操作失败：' + e.message;
            btn.disabled = false;
          }
        };
      });

      box.querySelectorAll('[data-invite]').forEach((btn) => {
        btn.onclick = async () => {
          const to = btn.getAttribute('data-invite');
          btn.disabled = true;
          if (msg()) msg().textContent = '发送中…';
          try {
            await apiCall('POST', 'request', { to: to, message: '一起学习吧' }, signal);
            if (alive()) renderReal('friends');
          } catch (e) {
            if (!alive()) return;
            if (e.status === 401) { dropSession(); renderLogin(box, '登录已失效，请重新登录。'); return; }
            if (msg()) msg().textContent = '发送失败：' + e.message;
            btn.disabled = false;
          }
        };
      });
    } else {
      const r = await apiCall('GET', 'posts?mode=all', undefined, signal);
      if (!alive()) return;

      const all = r.posts || [];
      const recent = all.slice(-3).reverse();

      box.innerHTML =
        '<div><b>已登录 ' + escHtml(authName) + '</b> · 公告栏 ' + all.length + ' 条' +
        ' <button id="realLogout" type="button" style="float:right">退出</button></div>' +
        '<div style="margin-top:4px">' + (recent.length
          ? recent.map((p) => '<div style="margin:2px 0"><b>' + escHtml(p.author.nick) + '</b> ' +
              escHtml((p.text || '').slice(0, 50)) + '</div>').join('')
          : '<em>还没有留言</em>') + '</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px">' +
        '<input id="realPost" placeholder="写一条真留言" maxlength="200" style="' + REAL_INPUT + '">' +
        '<button id="realSend" type="button">发布</button></div>' +
        '<div style="margin-top:6px"><button id="realRefresh" type="button">刷新留言</button></div>' +
        '<div id="realMsg" style="margin-top:6px;font-size:12px"></div>';

      const msg = () => document.getElementById('realMsg');

      document.getElementById('realLogout').onclick = () => {
        dropSession();
        renderLogin(box, '已退出，请重新登录。');
      };
      document.getElementById('realRefresh').onclick = () => renderReal('posts');

      document.getElementById('realSend').onclick = async () => {
        const input = document.getElementById('realPost');
        const text = input.value.trim();
        if (!text) { if (msg()) msg().textContent = '请先写点什么'; return; }
        if (msg()) msg().textContent = '发布中…';
        try {
          await apiCall('POST', 'posts', { text: text }, signal);
          input.value = '';
          if (msg()) msg().textContent = '已发布（真实写入）';
          later(() => { if (alive()) renderReal('posts'); }, 600);
        } catch (e) {
          if (!alive()) return;
          if (e.status === 401) { dropSession(); renderLogin(box, '登录已失效，请重新登录。'); return; }
          if (msg()) msg().textContent = '发布失败：' + e.message;
        }
      };
    }
  } catch (e) {
    if (!alive()) return;
    if (e.status === 401) {
      dropSession();
      renderLogin(box, '登录已失效，请重新登录。');
      return;
    }
    box.innerHTML = '<div class="social-ui__note">读取失败：' + escHtml(e.message) +
      '<br>接口：' + escHtml(API_BASE) +
      (e.status ? '<br>HTTP ' + e.status : '（网络异常或后端未启动）') + '</div>';
  }
}

function openPanel(it, result) {
  const kind = it.id === 'social.desk' ? 'friends' : it.id === 'social.board' ? 'posts' : null;
  beginPanelScope(kind);

  const copy = PANEL_COPY[it.id] || { title: it.label, sub: '', body: () => '' };
  panelTitle.textContent = copy.title;
  panelSub.textContent = copy.sub;
  panelBody.innerHTML = copy.body();

  if (it.id === 'social.fountain' && result && typeof result.on === 'boolean') {
    const el = document.getElementById('fountainState');
    if (el) {
      el.innerHTML = '<span class="social-ui__tag' + (result.on ? '' : ' is-warn') + '">当前状态</span> 水流：' +
        (result.on ? '开启（水面效果未实现）' : '关闭');
    }
  }

  panelEl.hidden = false;
  panelOpen = true;
  hintEl.classList.remove('is-on');

  if (kind) renderReal(kind);
}

function closePanel() {
  endPanelScope();
  panelEl.hidden = true;
  panelOpen = false;
  current = null;
  hintShown = undefined;
  for (const k of Object.keys(keys)) keys[k] = false;
  dragging = false;
  canvas.focus && canvas.focus();
}


document.getElementById('panelClose').addEventListener('click', closePanel);
panelEl.addEventListener('pointerdown', (e) => e.stopPropagation());

function trigger(it) {
  let result;
  try {
    result = it.action();
  } catch (err) {
    result = { ok: false, message: String(err && err.message || err) };
  }
  openPanel(it, result);
}

/* ---------- 主循环：唯一的 RAF，在这里 ---------- */

let rafId = 0;
let last = performance.now();
let frames = 0;
let fpsAcc = 0;
let fps = 0;

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  if (!panelOpen) {
    let f = 0, r = 0;
    if (keys.KeyW || keys.ArrowUp) f += 1;
    if (keys.KeyS || keys.ArrowDown) f -= 1;
    if (keys.KeyD || keys.ArrowRight) r += 1;
    if (keys.KeyA || keys.ArrowLeft) r -= 1;
    if (f || r) {
      const len = Math.hypot(f, r) || 1;
      const speed = (keys.ShiftLeft || keys.ShiftRight ? PLAYER.run : PLAYER.speed) * dt / len;
      const sin = Math.sin(yaw), cos = Math.cos(yaw);
      PLAYER.x += (-sin * f + cos * r) * speed;
      PLAYER.z += (-cos * f - sin * r) * speed;
      collide(PLAYER);
    }
    if (keys.KeyJ) yaw += dt * 1.6;
    if (keys.KeyL) yaw -= dt * 1.6;
  }

  camera.position.set(PLAYER.x, PLAYER.y, PLAYER.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  district.update(dt);

  if (!panelOpen) {
    const near = findNearest();
    current = near;
    const key = near ? near.id : null;
    if (key !== hintShown) {
      hintShown = key;
      if (near) {
        hintLabel.textContent = near.label + ' · ';
        hintPrompt.textContent = near.prompt.replace(/^按 E\s*/, '');
        hintEl.classList.add('is-on');
      } else {
        hintEl.classList.remove('is-on');
      }
    }
  }

  frames++;
  fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    fps = Math.round(frames / fpsAcc);
    frames = 0;
    fpsAcc = 0;
    debugEl.textContent =
      'x ' + PLAYER.x.toFixed(2) + '  z ' + PLAYER.z.toFixed(2) + '  h ' + PLAYER.y.toFixed(2) +
      '\nyaw ' + (yaw * 180 / Math.PI).toFixed(1) + '°  pitch ' + (pitch * 180 / Math.PI).toFixed(1) + '°' +
      '\nfov ' + CAMERA_FOV.toFixed(1) + '° ≈' + EQUIV_MM + 'mm  fps ' + fps +
      '\n碰撞体 ' + district.colliders.length + '  交互点 ' + district.interactions.length +
      '\n' + (LIVE ? '真实模块在线' : '预览替身（未接主站）');
  }

  renderer.render(scene, camera);
  rafId = requestAnimationFrame(tick);
}

/* 先同步画一帧：避免 rAF 启动前出现一帧空白（截图/慢设备都受益） */
camera.position.set(PLAYER.x, PLAYER.y, PLAYER.z);
camera.rotation.set(pitch, yaw, 0, 'YXZ');
district.update(0);
renderer.render(scene, camera);

ui.hidden = false;
// 截图用：?hud=0 隐藏所有覆盖层，不改交互与入口
if (qs.get('hud') === '0') ui.hidden = true;
rafId = requestAnimationFrame(tick);

/* 供自动化检查用：读当前交互点、强制触发一次（不改变主站行为） */
window.__social = {
  district,
  player: PLAYER,
  renderer,
  camera,
  get current() { return current; },
  get panelOpen() { return panelOpen; },
  get fov() { return CAMERA_FOV; },
  get env() { return envState; },
  interact() { if (current) trigger(current); return current ? current.id : null; },
  close() { closePanel(); },
};

/* 离开页面时清理，避免预览页反复热重载后堆积定时器与 WebGL 上下文 */
window.addEventListener('beforeunload', () => {
  cancelAnimationFrame(rafId);
  district.dispose();
  renderer.dispose();
});
</script>
